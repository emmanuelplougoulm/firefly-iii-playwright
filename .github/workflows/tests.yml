name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      update_snapshots:
        description: 'Regenerate all visual baselines'
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  playwright:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Type check
        run: npx tsc

      - name: Start Firefly III
        run: npm run app:up

      - name: Install browsers
        run: npx playwright install --with-deps chromium

      # Missing baselines are created on Linux and committed; existing ones are compared.
      - name: Playwright tests
        run: |
          if [ "${{ inputs.update_snapshots }}" = "true" ]; then
            npx playwright test --update-snapshots=all
          else
            npx playwright test --update-snapshots=missing
          fi

      - name: Commit new visual baselines
        if: github.event_name != 'pull_request'
        run: |
          if [ -n "$(git status --porcelain tests)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add tests
            git commit -m "chore: update visual baselines [skip ci]"
            git push
          fi

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 14

      - name: Firefly III logs on failure
        if: failure()
        run: docker compose -f docker/compose.yml logs app --tail 200
